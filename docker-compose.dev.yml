version: "3.8"
services:
  weave-ui-backend:
    build: .
    command: python main.py viz --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - weave-data:/app/data
    restart: unless-stopped

  weave-ui-frontend:
    image: node:20-alpine
    working_dir: /app/weave_ui/frontend
    command: npx vite --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./weave_ui/frontend:/app/weave_ui/frontend
    depends_on:
      - weave-ui-backend

volumes:
  weave-data:
